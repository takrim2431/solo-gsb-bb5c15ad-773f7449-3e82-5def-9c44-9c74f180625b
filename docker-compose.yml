services:
  planner:
    build: .
    image: course-planner:latest
    container_name: course-planner
    ports:
      - "8000:8000"
    volumes:
      - planner-data:/data
    environment:
      PLANNER_DB: /data/planner.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 8s

volumes:
  planner-data:
